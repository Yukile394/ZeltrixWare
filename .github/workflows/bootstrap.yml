name: Bootstrap (wrapper + decompile)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "src/main/java doluysa üzerine yaz"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Jar kontrol
        run: |
          set -euo pipefail
          f=original/ZeltrixWare.jar
          test -f "$f" || { echo "HATA: $f yok"; exit 1; }
          echo "Boyut (bayt): $(stat -c%s "$f")"
          echo "Tür: $(file "$f")"
          echo "İlk 120 bayt:"
          head -c 120 "$f" | cat -v
          echo
          if ! unzip -tq "$f" >/dev/null 2>&1; then
            echo "HATA: $f geçerli bir jar/zip değil. Beklenen boyut ~13123999 bayt."
            exit 1
          fi
          echo "Jar geçerli."

      - name: Gradle wrapper üret
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "rootProject.name = 'wrapper-tmp'" > "$tmp/settings.gradle"
          (cd "$tmp" && gradle wrapper --gradle-version 8.8 --distribution-type bin)
          cp -r "$tmp/gradle" ./gradle
          cp "$tmp/gradlew" "$tmp/gradlew.bat" ./
          chmod +x gradlew

      - name: Decompile + remap
        run: |
          set -euo pipefail
          args=(--jar original/ZeltrixWare.jar --root . --yarn "1.21+build.9")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          python3 tools/decompile.py "${args[@]}"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "bootstrap: gradle wrapper + decompiled sources"
            git push
          fi
